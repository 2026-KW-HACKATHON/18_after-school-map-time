<dl class="fields">
  {% for f in fields %}
    <div class="field-row">
      <dt>{{ f.label }}</dt>
      <dd>
        {% if f.value is not None %}
          {{ f.value }}{{ f.unit }} <span class="badge-neutral">확인됨</span>
        {% else %}
          <span class="muted">정보 없음</span>
        {% endif %}
        {% if f.pending_owner %}<span class="badge-neutral">사장님이 정정을 요청했어요 (확인 중)</span>
        {% elif f.pending %}<span class="badge-neutral">새 제보 확인 중</span>{% endif %}
      </dd>
    </div>
  {% endfor %}
</dl>
