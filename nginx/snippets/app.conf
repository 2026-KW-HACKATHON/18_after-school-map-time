# ─────────────────────────────────────────────────────────
# http / https 설정이 공통으로 쓰는 부분 (server 블록 안에서 include)
#   /static/ /media/ 는 nginx가 직접 서빙, 나머지는 Django(web:8000)로 전달
# ─────────────────────────────────────────────────────────

# 폰 사진(3~8MB) 업로드 허용. 기본값 1MB면 413 에러. Django 설정(10MB)과 맞춤
client_max_body_size 10M;

# collectstatic 결과 (static_volume). 파일명이 바뀌지 않으므로 브라우저 캐시 7일
location /static/ {
    alias /app/staticfiles/;
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
}

# 제보 사진 (media_volume)
location /media/ {
    alias /app/media/;
    expires 1d;
    add_header Cache-Control "public";
}

# 그 외 요청은 전부 Django(gunicorn)로
location / {
    proxy_pass http://web:8000;

    # Django가 원래 요청 정보를 알 수 있게 전달
    proxy_set_header Host $host;                                   # ALLOWED_HOSTS 검사용
    proxy_set_header X-Real-IP $remote_addr;                       # 실제 사용자 IP
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;                    # https 여부 (settings.py SECURE_PROXY_SSL_HEADER)

    # AI 사진 판별처럼 느린 응답 대기 (gunicorn --timeout 60 과 맞춤)
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
