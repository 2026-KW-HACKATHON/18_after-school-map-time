# ─────────────────────────────────────────────────────────
# 개발용 docker compose (로컬 PC에서 실행)
#   web: Django runserver (코드 수정하면 자동 재시작) → http://localhost:8000
#   db : PostgreSQL 16
# 배포용 구성은 docker-compose.prod.yml (nginx 포함)을 따로 씁니다.
# ─────────────────────────────────────────────────────────

services:
  web:
    build: .
    # 개발 중에는 gunicorn 대신 runserver (자동 리로드, 에러 화면)
    # 시작할 때 migrate → 기본 데이터(지역·필드 정의) → 판정 규칙 → runserver
    # seed_base·load_rules는 여러 번 실행해도 결과가 같음 (places/data, judgments/data 의 JSON 기준으로 갱신)
    command: sh -c "python manage.py migrate && python manage.py seed_base && python manage.py load_rules && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app          # 내 PC의 코드를 컨테이너에 연결 → 수정 즉시 반영 (재빌드 불필요)
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy   # db가 접속 가능해진 뒤에 web 시작 (시작 직후 DB 연결 에러 방지)

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data   # 컨테이너를 지워도 데이터 유지
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teokeopne}
      POSTGRES_USER: ${POSTGRES_USER:-teokeopne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teokeopne}
    ports:
      - "5432:5432"     # 개발에서만 노출 (DB 툴로 접속용). 배포 구성에서는 노출하지 않음
    healthcheck:
      # pg_isready: Postgres가 접속을 받을 준비가 됐는지 확인하는 공식 도구
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
