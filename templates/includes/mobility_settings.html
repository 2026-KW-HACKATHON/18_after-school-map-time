{% load static %}
<div class="mobility-settings" data-mobility
     data-catalogue-url="{% url 'api:mobility-catalogue' %}"
     data-preferences-url="{% url 'api:mobility-preferences' %}"
     data-evaluate-url="{% url 'api:mobility-evaluate' %}"
     data-place-id="{{ place.pk|default:'' }}" data-mode="{{ mobility_mode|default:'map' }}"
     data-region="{% if place %}{{ place.region.code }}{% elif region %}{{ region.code }}{% endif %}">
  <div class="mobility-toolbar">
    <label class="sr-only" for="mobility-more">다른 이동 조건 선택</label>
    <select id="mobility-more" data-mobility-more aria-label="다른 이동 조건 선택" disabled><option value="">다른 이동 조건</option></select>
    <button type="button" class="btn" data-mobility-open aria-label="내 이동 조건 수정" disabled>내 조건 수정</button>
  </div>
  <p class="muted small" data-mobility-summary></p>
  <p class="small" data-mobility-warning role="status" aria-live="polite"></p>
  <div class="{% if mobility_mode != 'search' %}card {% endif %}mobility-result" data-mobility-result hidden aria-live="polite"></div>
  <dialog class="mobility-dialog" data-mobility-dialog aria-labelledby="mobility-title">
    <form data-mobility-form>
      {% csrf_token %}
      <h2 id="mobility-title">내 이동 조건 수정</h2>
      <p class="muted small">기본값으로 바로 이용할 수 있어요. 필요한 항목만 바꾸세요.</p>
      <div class="field"><label for="mobility-preset">현재 Preset</label><select id="mobility-preset" data-mobility-preset></select></div>
      <p class="notice small" data-mobility-recommendation hidden></p>
      <div class="field" data-mobility-companion-box hidden>
        <label for="mobility-companion">동반자의 실제 이동 조건</label>
        <select id="mobility-companion" data-mobility-companion></select>
        <p class="small muted">추천값은 신분에 따른 판정이 아니에요. 조건을 바꾸면 이 동반자 Preset의 수정값만 초기화하고, 다른 설정은 유지해요.</p>
      </div>
      <div data-mobility-fields></div>
      <details class="mobility-multiple"><summary>동반자·여러 이동 조건 함께 적용</summary>
        <p class="small muted">모두 이용할 수 있는 같은 경로를 확인해요. 다른 사람의 원래 설정을 바꾸거나 서로 다른 입구를 섞지 않아요.</p>
        <div data-mobility-multiple></div>
      </details>
      <p class="notice small" data-mobility-notice></p>
      <p data-mobility-error role="alert"></p>
      <div class="actions mobility-actions">
        <button type="button" class="btn" data-mobility-reset>이 조건 기본값으로</button>
        <button type="button" class="btn" data-mobility-cancel>취소</button>
        <button type="submit" class="btn btn-primary" data-mobility-save>설정 저장</button>
      </div>
    </form>
  </dialog>
</div>
